# Exemplo de site nginx na frente do container (porta 8000 local).
server {
    listen 80;
    server_name leitor.seudominio.com;

    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A rota de áudio só responde quando a frase termina de ser gerada;
        # em CPU isso pode passar de um minuto numa frase longa.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
