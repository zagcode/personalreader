<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="build" content="__BUILD__">
  <title>Personal Reader</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=__BUILD__">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Personal Reader</a>
    <div class="topbar-end">
      <span class="engine" id="engine-status" aria-live="polite"></span>
      <select id="ui-lang" class="ui-lang" data-i18n-label="lang.label"></select>
    </div>
  </header>

  <!-- Biblioteca / envio -->
  <main id="home" class="home" hidden>
    <label class="drop" id="drop">
      <input type="file" id="file-input">
      <span class="drop-title" data-i18n="drop.title"></span>
      <span class="drop-hint"><span data-i18n="drop.hint"></span> <span id="formats"></span></span>
      <span class="drop-progress" id="upload-status" aria-live="polite"></span>
    </label>

    <section class="library" aria-labelledby="lib-title">
      <h2 id="lib-title" data-i18n="library.title"></h2>
      <p class="empty" id="lib-empty" data-i18n="library.empty" hidden></p>
      <ul id="lib-list"></ul>
    </section>
  </main>

  <!-- Leitura -->
  <main id="reader" class="reader" hidden>
    <div class="reader-head">
      <a href="#/" class="back" data-i18n="reader.back"></a>
      <h1 id="doc-title"></h1>
    </div>
    <p class="doc-state" id="doc-state" aria-live="polite"></p>
    <span class="meter convert-meter" id="convert-meter" hidden><span></span></span>
    <article id="doc-text" class="doc-text"></article>
  </main>

  <footer class="player" id="player" hidden>
    <div class="player-main">
      <div class="transport">
        <button type="button" id="btn-prev" data-i18n-label="player.prev" data-shortcut="←">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button type="button" id="btn-play" class="play" data-i18n-label="player.play">
          <svg viewBox="0 0 24 24" class="i-play" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
          <svg viewBox="0 0 24 24" class="i-pause" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <button type="button" id="btn-next" data-i18n-label="player.next" data-shortcut="→">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
        <button type="button" id="btn-again" data-i18n-label="player.again" data-shortcut="A">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
      </div>
      <div class="where">
        <span id="position">—</span>
        <span id="play-state" class="play-state" aria-live="polite"></span>
        <div class="buffer" id="buffer" aria-hidden="true"></div>
      </div>
      <button type="button" class="settings-toggle" id="btn-settings" aria-expanded="false" aria-controls="settings">
        <span data-i18n="settings.toggle"></span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div class="settings" id="settings" hidden>
      <label><span data-i18n="settings.voice"></span>
        <select id="opt-voice"></select>
        <span class="hint" id="voice-hint" data-i18n="settings.voiceHint" hidden></span>
      </label>
      <label><span data-i18n="settings.speed"></span>
        <select id="opt-rate"></select>
      </label>
      <label><span data-i18n="settings.pause"></span>
        <select id="opt-pause"></select>
      </label>
      <label><span data-i18n="settings.repeat"></span>
        <select id="opt-repeat"></select>
      </label>
      <label class="check">
        <input type="checkbox" id="opt-listen">
        <span data-i18n="settings.listen"></span>
      </label>
    </div>
  </footer>

  <template id="checkpoint-tpl">
    <div class="checkpoint" role="group" data-i18n-label="checkpoint.label">
      <p data-i18n="checkpoint.question"></p>
      <div class="checkpoint-actions">
        <button type="button" class="primary" data-act="continue" data-i18n="player.continue"></button>
        <button type="button" data-act="replay" data-i18n="checkpoint.replay"></button>
      </div>
    </div>
  </template>

  <script src="/static/i18n.js?v=__BUILD__"></script>
  <script src="/static/app.js?v=__BUILD__"></script>
</body>
</html>
